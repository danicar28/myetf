<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b1b4d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/><rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g >
    <g filter="url(#sh)">
      <rect x="96"  y="294" width="74" height="112" rx="16" fill="url(#bar)" fill-opacity=".55"/>
      <rect x="219" y="236" width="74" height="170" rx="16" fill="url(#bar)" fill-opacity=".8"/>
      <rect x="342" y="172" width="74" height="234" rx="16" fill="url(#bar)"/>
    </g>
    <g filter="url(#sh)">
      <polyline points="92,236 200,166 286,204 392,104" fill="none" stroke="url(#line)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="372,78 430,76 428,134" fill="#fde68a" stroke="#fde68a" stroke-width="14" stroke-linejoin="round"/>
    </g>
  </g>
